name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    defaults:
      run:
        # Windows PowerShell 5.1 - what the tool targets out of the box.
        shell: powershell
    steps:
      - uses: actions/checkout@v5

      - name: Install Pester and PSScriptAnalyzer
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module Pester -MinimumVersion 5.5.0 -Scope CurrentUser -Force -SkipPublisherCheck
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force

      - name: Lint (PSScriptAnalyzer)
        run: |
          $findings = Invoke-ScriptAnalyzer -Path . -Recurse -Settings ./PSScriptAnalyzerSettings.psd1
          $findings | Format-Table RuleName, Severity, ScriptName, Line, Message -AutoSize -Wrap
          if ($findings) { throw "PSScriptAnalyzer reported $(@($findings).Count) finding(s)." }

      - name: Unit tests (Pester)
        run: |
          Import-Module Pester -MinimumVersion 5.5.0
          Invoke-Pester -Path tests -CI
